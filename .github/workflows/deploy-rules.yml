name: Deploy Firebase Rules (after frontend)
on:
  workflow_dispatch:
    inputs:
      frontend_verified:
        description: 'Confirm the new frontend is live and authenticated smoke tests passed'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-firebase-backend
  cancel-in-progress: false
env:
  FIREBASE_PROJECT_ID: i-m-tourn
  FIREBASE_STORAGE_BUCKET: i-m-tourn.firebasestorage.app
jobs:
  deploy:
    if: inputs.frontend_verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run test:rules
      - name: Write credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules
        run: npx firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
      - name: Verify active Firestore and Storage rules
        run: node scripts/verify-deployed-rules.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
