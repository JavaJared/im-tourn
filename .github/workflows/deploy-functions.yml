name: Deploy Firebase Backend
on:
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'functions/**'
      - 'src/lib/**'
      - 'src/services/interactiveSort.js'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-firebase-backend
  cancel-in-progress: false
env:
  FIREBASE_PROJECT_ID: i-m-tourn
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run check && npm run test:rules
      - name: Write credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Retain artifacts without modifying cleanup policies or forcing deployment.
      - name: Retain Firebase build artifacts
        run: node scripts/retain-build-artifacts.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
      - name: Deploy functions and indexes
        run: npx firebase deploy --only functions,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
      - name: Allow Netlify production builds to proceed
        run: node scripts/mark-backend-ready.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
