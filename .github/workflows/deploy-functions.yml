name: Deploy Firebase Backend
on:
  push:
    branches: [main]
    paths:
      - 'im-tourn/functions/**'
      - 'im-tourn/src/lib/**'
      - 'im-tourn/src/services/interactiveSort.js'
      - 'im-tourn/firestore.indexes.json'
      - 'im-tourn/package.json'
      - 'im-tourn/package-lock.json'
      - 'im-tourn/scripts/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-firebase-backend
  cancel-in-progress: false
env:
  FIREBASE_PROJECT_ID: i-m-tourn
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: im-tourn
      - run: npm ci
        working-directory: im-tourn/functions
      - run: npm run check && npm run test:rules
        working-directory: im-tourn
      - name: Write credentials
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Retain build artifacts; opt out of the interactive cleanup-policy prompt.
      # --force is scoped to this policy command, never to function deletion.
      - name: Retain Firebase build artifacts
        working-directory: im-tourn
        run: npx firebase functions:artifacts:setpolicy --none --force --location us-central1 --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
      - name: Deploy functions and indexes
        working-directory: im-tourn
        run: npx firebase deploy --only functions,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
      - name: Allow Netlify production builds to proceed
        working-directory: im-tourn
        run: node scripts/mark-backend-ready.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
