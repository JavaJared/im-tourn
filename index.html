    <title>I'm Tourn - Create Custom Tournament Brackets</title>
    <link rel="stylesheet" href="/src/components/BracketLoader.css" />
  </head>
  <body>
    <div id="root"><div class="bracket-loader bracket-loader--startup" role="status" aria-live="polite"><svg viewBox="0 0 240 128" aria-hidden="true" focusable="false">
      <g class="bracket-loader-lines" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
        <path d="M48 20h28v12h28M48 44h28V32M48 92h28v12h28M48 116h28v-12"/>
        <path d="M136 32h24v42h28M136 104h24V74"/>
      </g>
      <rect class="bracket-loader-entry" x="12" y="12" width="36" height="16" rx="5"/><rect class="bracket-loader-entry" x="12" y="36" width="36" height="16" rx="5"/><rect class="bracket-loader-entry" x="12" y="84" width="36" height="16" rx="5"/><rect class="bracket-loader-entry" x="12" y="108" width="36" height="16" rx="5"/>
      <rect class="bracket-loader-round" x="104" y="24" width="32" height="16" rx="5"/>
      <rect class="bracket-loader-round bracket-loader-round--second" x="104" y="96" width="32" height="16" rx="5"/>
      <g class="bracket-loader-champion"><rect x="188" y="64" width="40" height="32" rx="8"/><path d="m197 87-2-13 8 6 5-10 5 10 8-6-2 13Z"/></g>
    </svg><span>Loading I’m Tourn…</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
